name: Prepare authored source
on:
  push:
    branches: [codex/prepare-report-ci]
    paths: [.github/workflows/prepare-authored.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply tree-verified report fix
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/codex/prepare-report-ci
          test "$(git rev-parse HEAD^)" = a793ae8c8e6826180c6470b6d77e59861feda4e2
          python3 - <<'PYCODE'
          import base64, gzip
          from pathlib import Path
          Path('/tmp/authored.patch').write_bytes(gzip.decompress(base64.b64decode('')))
          PYCODE
          git apply --check /tmp/authored.patch
          git apply --index /tmp/authored.patch
          git rm .github/workflows/prepare-authored.yml
          git diff --cached --check
          test "$(git write-tree)" = 4becc7ff1d9934a406bda587de2ba0bda69b4c0b
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(reports): expose report accessibility values and make recovery headers actionable'
          git push origin HEAD:refs/heads/codex/prepare-report-ci
          git bundle create "$RUNNER_TEMP/prepared-source.bundle" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/prepared-head.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: prepared-source
          path: |
            ${{ runner.temp }}/prepared-source.bundle
            ${{ runner.temp }}/prepared-head.txt
          retention-days: 3
