name: Source-only session handoff
on:
  push:
    branches: [codex/beacon-session-source-handoff]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bundle repository objects without checkout credentials or config
        shell: bash
        run: |
          set -euo pipefail
          git bundle create "$RUNNER_TEMP/beacon-source.bundle" --all
          git bundle verify "$RUNNER_TEMP/beacon-source.bundle"
      - uses: actions/upload-artifact@v4
        with:
          name: beacon-source-only
          path: ${{ runner.temp }}/beacon-source.bundle
          retention-days: 3
