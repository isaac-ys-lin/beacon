name: Prepare iPhone setup source
on:
  push:
    branches: [codex/issue-3-iphone-setup]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-3-iphone-setup
      - name: Apply verified authored changes and generate project
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = codex/issue-3-iphone-setup
          git apply --check .beacon-agent-change.patch
          git apply .beacon-agent-change.patch
          while read -r expected path; do
            test "$(git hash-object "$path")" = "$expected" || { echo "Source mismatch: $path"; exit 1; }
          done <<'EXPECTED'
          43da14e4a78e54fdc2002140f0fd4422d940d53a Beacon/Mac/BeaconMacApp.swift
          5e900eae038f62e403d881453e196e0fe32acb2c Beacon/Mac/BeaconSettingsSupportViews.swift
          ff4592def350d44e4f7195acc8ccb60283efc408 Beacon/Mac/BeaconSettingsView.swift
          01499bbde08e9aad735626af5e3984792a655b64 Beacon/Mac/BeaconSettingsWindowController.swift
          37f96675c8bbe7a2665719f2bb3282bb236fa370 Beacon/Mac/BeaconStatusController.swift
          06a98d082e87487840d28c836d42ba14ab82ec44 Beacon/Mac/IPhoneLockdownBatteryProvider.swift
          d19c897ed6e63edb5041877ac19423f0d4d40b82 Beacon/Mac/zh-Hant-TW.lproj/Localizable.strings
          e5dec698536d61e1c2e7d248f3ab7443abca65ee BeaconUITests/BeaconUITests.swift
          5c7f654f5898ff98b93564a0e33506777f829dc7 Beacon/Mac/IPhoneSetupView.swift
          a5ba4a78a77140227cb6fe88c17a08cc92429fa2 BeaconTests/IPhoneSetupFlowTests.swift
          EXPECTED
          brew install xcodegen
          xcodegen generate
          git diff --check
          rm .beacon-agent-change.patch
          git add Beacon BeaconTests BeaconUITests Beacon.xcodeproj .beacon-agent-change.patch
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(iphone): complete tool, trust, enrollment and fresh-reading recovery (#3)'
          git push origin HEAD:refs/heads/codex/issue-3-iphone-setup
