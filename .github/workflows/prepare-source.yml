name: Synchronize authored report tests
on:
  push:
    branches: [codex/issue-4-report-trust]
    paths: [.github/workflows/prepare-source.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply authored changes and preserve both parent histories
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/codex/issue-4-report-trust
          test "$(git rev-parse HEAD^)" = d01b4ac619af44db7d93da2914121a5c9cc25c55
          python3 - <<'PYCODE'
          import base64, gzip
          from pathlib import Path
          Path('/tmp/beacon-authored.patch').write_bytes(gzip.decompress(base64.b64decode('')))
          PYCODE
          git apply --check /tmp/beacon-authored.patch
          git apply --index /tmp/beacon-authored.patch
          git rm .github/workflows/prepare-source.yml
          git diff --cached --check
          test "$(git write-tree)" = df2439953220d0d34a72ded53c094ef9362b3d99
          commit="$(git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit-tree df2439953220d0d34a72ded53c094ef9362b3d99 -p "$GITHUB_SHA" -p f0ac474bd324249f8e0f577e2f5eb9a7e2595573 -m 'test(reports): preserve iPhone CI fix and verify report recovery (#4)')"
          git update-ref refs/heads/prepared-source "$commit"
          git push origin "$commit":refs/heads/codex/issue-4-report-trust
          git bundle create "$RUNNER_TEMP/prepared-source.bundle" refs/heads/prepared-source
      - uses: actions/upload-artifact@v4
        with:
          name: prepared-source
          path: ${{ runner.temp }}/prepared-source.bundle
          retention-days: 3
