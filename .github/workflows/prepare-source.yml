name: Correct iPhone setup destination
on:
  push:
    branches: [codex/issue-3-iphone-setup]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-3-iphone-setup
      - name: Observe sheet destination before presentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Beacon/Mac/BeaconSettingsView.swift')
          s = p.read_text()
          old = '        let _ = alertPreferencesRevision\n'
          assert s.count(old) == 1
          p.write_text(s.replace(old, old + '        let _ = isShowingIPhoneSetup\n'))
          PY
          test "$(git hash-object Beacon/Mac/BeaconSettingsView.swift)" = 577bb402407fc0981007d98d7ed62cb9a9a4ad25
          git diff --check
          git add Beacon/Mac/BeaconSettingsView.swift
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(iphone): observe setup destination before presenting its sheet (#3)'
          git push origin HEAD:refs/heads/codex/issue-3-iphone-setup
