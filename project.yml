name: Beacon
options:
  bundleIdPrefix: com.isaacyslin
  developmentLanguage: en
  knownRegions:
    - en
    - zh-Hant-TW
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_DEBUG_DYLIB: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_STYLE: Manual
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  BeaconMac:
    type: application
    platform: macOS
    sources:
      - path: Beacon/Shared
      - path: Beacon/Mac
      - path: Beacon/WidgetShared
    dependencies:
      - target: BeaconWidgets
        embed: true
        codeSign: true
    entitlements:
      path: Beacon/Mac/BeaconMac.entitlements
      properties:
        # NOT sandboxed: Beacon shells out to ideviceinfo (outside the bundle,
        # talking to usbmuxd) to read USB iPhone battery. The App Sandbox blocks
        # spawning external binaries, so enabling it silently breaks iPhone-over-
        # USB. Keep this app non-sandboxed (no MAS) — see docs / design notes.
        com.apple.security.device.bluetooth: true
        # Shares the battery list with the (sandboxed) WidgetKit extension.
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)com.isaacyslin.Beacon
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Beacon/Mac/Info.plist
        INFOPLIST_PREPROCESS: YES
        INFOPLIST_PREPROCESSOR_DEFINITIONS: BEACON_LSUIELEMENT=1
        PRODUCT_BUNDLE_IDENTIFIER: com.isaacyslin.Beacon.mac
        PRODUCT_MODULE_NAME: Beacon
      configs:
        Debug:
          # A Debug bundle must be a normal LaunchServices app so XCTest can
          # vend panel accessibility. BeaconMacApp still selects .accessory
          # for every non-UI-test launch.
          INFOPLIST_PREPROCESSOR_DEFINITIONS: BEACON_LSUIELEMENT=0
  BeaconWidgets:
    type: app-extension
    platform: macOS
    sources:
      - path: Beacon/Widget
      - path: Beacon/WidgetShared
    info:
      path: Beacon/Widget/Info.plist
      properties:
        CFBundleDisplayName: Beacon
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        BeaconAppGroup: $(TeamIdentifierPrefix)com.isaacyslin.Beacon
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Beacon/Widget/BeaconWidgets.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)com.isaacyslin.Beacon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.isaacyslin.Beacon.mac.widgets
        PRODUCT_NAME: BeaconWidgets
        SKIP_INSTALL: YES
  BeaconTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: BeaconTests
    dependencies:
      - target: BeaconMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.isaacyslin.Beacon.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/BeaconMac.app/Contents/MacOS/BeaconMac
        BUNDLE_LOADER: $(TEST_HOST)
  BeaconUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: BeaconUITests
    dependencies:
      - target: BeaconMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.isaacyslin.Beacon.uitests
        TEST_TARGET_NAME: BeaconMac
        GENERATE_INFOPLIST_FILE: YES
schemes:
  BeaconMac:
    build:
      targets:
        BeaconMac: all
    test:
      targets:
        - BeaconTests
      gatherCoverageData: false
  BeaconMacUI:
    build:
      targets:
        BeaconMac: all
        BeaconUITests: [test]
    test:
      targets:
        - BeaconUITests
      gatherCoverageData: false
